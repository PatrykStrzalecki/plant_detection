services:

  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - .env
    volumes:
      - ./data/input:/app/data/input
      - ./data/output:/app/data/output
    depends_on:
      - redis
      - db
    networks:
      - app_net
    restart: always

  worker:
    build:
      context: .
      dockerfile: ./worker/Dockerfile
    container_name: worker
    volumes:
      - ./data/input:/app/data/input
      - ./data/output:/app/data/output
    env_file: 
      - .env
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    runtime: nvidia
    depends_on:
      - redis
      - db
    networks:
      - app_net
    restart: always

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - app_net
    restart: always

  db:
    image: postgres:latest
    container_name: postgres
    env_file:
      - .env
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./database/init_db:/docker-entrypoint-initdb.d
    networks:
      - app_net
    restart: always

  frontend:
    container_name: frontend
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    ports:
      - "${FRONTEND_PORT:-80}:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
    depends_on:
      - backend
    networks:
      - app_net
    restart: always

volumes:
  db_data:
    driver: local

networks:
  app_net:
    driver: bridge